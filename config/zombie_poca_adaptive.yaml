# Zombie multi-agent coordination training (MA-POCA) with an evader-speed curriculum.
#
# Comments are ASCII-only on purpose: ml-agents opens this file without an
# encoding, so on a Korean Windows any UTF-8 Hangul here crashes the loader.
#
# Difficulty is adaptive and handled inside Unity (ZombieTrainingArena):
#   each arena raises the evader speed by 0.1 when the last 20 episodes had
#   >= 60% captures and lowers it when < 30%. No environment_parameters needed.
#   The progress-based curriculum used before kept raising the speed even while
#   the team was failing, which made training collapse.
#   Pursuit/EvaderSpeed in TensorBoard is the main performance signal: rising
#   above the zombie speed (3.5) means the team catches a faster evader.
#
# Open circular arena run. Warm-start with --initialize-from=zombie_poca_open.
# In the walled square arena the zombies learned to herd the evader into walls
# and corners instead of encircling it. The circular arena has no corners, so
# cutting off the escape path is the only way to catch a faster evader.

behaviors:
  Zombie:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 1.5e-2              # kept high on purpose (diversity), see zombie_poca.yaml
      beta_schedule: constant
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 500000
    max_steps: 10000000      # bigger arena, longer chases
    time_horizon: 128
    summary_freq: 20000
