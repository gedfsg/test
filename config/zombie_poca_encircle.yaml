# Zombie MA-POCA, observation v2 + potential-based encirclement shaping.
#
# Comments are ASCII-only on purpose: ml-agents opens this file without an
# encoding, so on a Korean Windows any UTF-8 Hangul here crashes the loader.
#
# Why: zombie_poca_intel plateaued at evader speed ~2.5 with EscapeGapDeg ~240-255,
# i.e. the team kept chasing from behind and never discovered encirclement alone.
#
# encircle_reward: every step the team gets (score_now - score_prev) * weight,
#   where score is 0..1 (1 = zombies within 10 m spread 120 deg apart around the evader).
#   This is potential-based shaping (Ng et al., 1999): the episode total telescopes to
#   (final score - initial score), so it guides exploration without changing which policy
#   is optimal, and it cannot be farmed by stalling. Set to 0 to disable without rebuilding.
# adaptive_start: evader speed each arena starts at. The previous run had already reached
#   about 2.5, so start there instead of falling back to 2.4.
#
# Warm start from the plateaued run (same observation size, 31):
#   mlagents-learn config/zombie_poca_encircle.yaml --run-id=zombie_poca_encircle
#     --initialize-from=zombie_poca_intel --env="BuildsOpen/My First Game.exe"
#     --no-graphics --num-envs=2

behaviors:
  Zombie:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 1.5e-2
      beta_schedule: constant
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 500000
    max_steps: 10000000
    time_horizon: 256
    summary_freq: 20000

environment_parameters:
  encircle_reward: 0.5
  adaptive_start: 2.5
