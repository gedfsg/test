# Zombie multi-agent coordination (MA-POCA), observation v2 ("team intel").
#
# Comments are ASCII-only on purpose: ml-agents opens this file without an
# encoding, so on a Korean Windows any UTF-8 Hangul here crashes the loader.
#
# What changed vs zombie_poca_adaptive.yaml
#   1. Observation size 20 -> 31 (shared last-seen position, evader velocity,
#      teammate position relative to the target). The network shape changed,
#      so this run MUST start from scratch: do NOT pass --initialize-from.
#   2. gamma 0.99 -> 0.995. Decisions happen every 5 physics steps, so 0.99
#      only looked about 10 s ahead while an average capture took about 60 s.
#      Cutting off an escape route pays off far in the future; with the old
#      gamma the capture reward was practically invisible early in a chase.
#   3. time_horizon 128 -> 256 to match the longer effective horizon.
#
# Difficulty stays adaptive inside Unity (ZombieTrainingArena, window 10).

behaviors:
  Zombie:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 1.5e-2
      beta_schedule: constant
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 500000
    max_steps: 20000000
    time_horizon: 256
    summary_freq: 20000
