# Zombie multi-agent coordination training (MA-POCA) with an evader-speed curriculum.
#
# Comments are ASCII-only on purpose: ml-agents opens this file without an
# encoding, so on a Korean Windows any UTF-8 Hangul here crashes the loader.
#
# Why a curriculum:
#   Zombie speed is 3.5. When the evader is slower, straight pursuit always wins
#   and there is no reason to coordinate. Encirclement only becomes necessary
#   when the evader is as fast or faster. Jumping straight to a fast evader
#   gives zero captures and no learning signal, so the speed is raised in steps.
#
# Open circular arena run. Warm-start with --initialize-from=zombie_poca_02.
# In the walled square arena the zombies learned to herd the evader into walls
# and corners instead of encircling it. The circular arena has no corners, so
# cutting off the escape path is the only way to catch a faster evader.

behaviors:
  Zombie:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 1.5e-2              # kept high on purpose (diversity), see zombie_poca.yaml
      beta_schedule: constant
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 500000
    max_steps: 10000000      # bigger arena, longer chases
    time_horizon: 128
    summary_freq: 20000

environment_parameters:
  # Center of the evader speed; each episode samples center +/- 0.3.
  # Zombie speed is 3.5.
  evader_speed:
    curriculum:
      - name: Equal              # same as zombie_poca_01, lets the warm start settle
        completion_criteria:
          measure: progress
          behavior: Zombie
          threshold: 0.15
        value: 3.5
      - name: SlightlyFaster     # straight pursuit starts to fail
        completion_criteria:
          measure: progress
          behavior: Zombie
          threshold: 0.4
        value: 4.0
      - name: Faster             # only cutting off escape routes works
        value: 4.5
