  intel_share_radius: 0
  slot_residual: 0.8
  slot_follow_reward: 0.0
  encircle_reward: 0.5
  cutoff_reward: 0.25
  normal_speed: 4.5
  runner_speed: 5.75
  tank_speed: 3.0
  adaptive_start: 4.4
  adaptive_min: 2.0
  adaptive_max: 6.0
  adaptive_window: 10
  adaptive_step: 0.1
  adaptive_raise: 0.55
  adaptive_lower: 0.3
  dummy_shoot: 1
  dummy_fire_interval: 0.1
  dummy_fire_interval_max: 0.5
  dummy_damage: 20.0
  dummy_mag: 30
  dummy_reload: 1.5
  dummy_bullet_speed: 70.0
  dummy_bullet_speed_max: 150.0
  dummy_range: 25.0
  dummy_spread: 15.0
  dummy_turn_speed: 180.0
  dummy_reaction: 0.6
  dummy_aim_lead: 0.3
  dummy_perception_delay: 0.4
  dummy_sprint: 1
  dummy_sprint_mult: 1.8
  dummy_stamina: 100
  dummy_sprint_cost: 25
  dummy_stamina_regen: 15
  dummy_sprint_dist: 6
  dummy_backpedal: 0.8
  dummy_flee_scale: 0.75
  zombie_hp_normal: 1000000.0
  zombie_hp_runner: 1000000.0
  zombie_hp_tank: 1000000.0
  zombie_death_penalty: 0.0
  zombie_hit_penalty: 0.008
  slot_residual_lateral: 1
  zombie_hit_stun: 0.3
  zombie_tank_stun_scale: 1.0
  zombie_tank_hit_penalty_scale: 1.0
  tank_intercept: 0
