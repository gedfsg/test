# shoot10: "slide out of the player's view". Continue from zombie_shoot7b (10M). Closing stays with the coordinator rule.
# shoot5's aim-LINE penalty (1.2 m band) was practically undodgeable with 70-150 m/s bullets, so dodging never paid off.
# New: view-CONE penalty. While the dummy is not sprinting, a zombie 4-25 m away inside +-20 deg of where the dummy
# looks loses up to 0.02 per second (more at the center). Not applied while the coordinator orders that zombie to rush,
# while stunned, or while the dummy sprints (then its view = running direction = the cutoff slot).
# Zombies already observe the aim angle (threat sensor cos/sin), so stepping sideways out of the cone is learnable.
# Watch Dodge/InCone (should go DOWN), Dodge/FacingAngle (should go UP), and Pursuit/CaptureRate (should not drop much).
# Needs a rebuild (ZombieTrainingArena.cs).
# mlagents-learn config/zombie_poca_shoot10.yaml --run-id=zombie_shoot10 --initialize-from=zombie_shoot7b --env="BuildsShoot/My First Game.exe" --no-graphics --num-envs=2
behaviors:
  Zombie:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.008
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 500000
    max_steps: 10000000
    time_horizon: 256
    summary_freq: 20000

environment_parameters:
  kill_mode: 0
  pinned_capture: 1
  pinned_max_gap: 150.0
  pinned_radius: 8.0
  pinned_control_angle: 25.0
