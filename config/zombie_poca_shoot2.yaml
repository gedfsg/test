# Step "the evader shoots back", second try: per-hit penalty for the zombie
# that was hit.
#
# Comments are ASCII-only on purpose: ml-agents opens this file without an
# encoding, so on a Korean Windows any UTF-8 Hangul here crashes the loader.
#
# zombie_shoot (zombie_poca_shoot.yaml) at 3.6M: capture went 17% -> 32-39%,
# but mostly because the adaptive rule slowed the evader (2.6 -> 2.14). At the
# same evader speed (2.2) capture was 31% early vs 34% late, and the dummy's
# hit rate stayed at 56-58% the whole time: the zombies did not learn to
# dodge. The only "getting shot is bad" signal was the team death penalty,
# which arrives after several hits and is shared by all five, so it cannot
# tell who dodged. Here the zombie that is hit pays -0.05 immediately
# (needs the rebuilt arena; only on hits, so no reward-for-stalling loophole).
# Same inputs, so it continues from zombie_shoot:
#
#   mlagents-learn config/zombie_poca_shoot2.yaml --run-id=zombie_shoot2
#     --initialize-from=zombie_shoot
#     --env="BuildsShoot/My First Game.exe" --no-graphics --num-envs=2
#
# Also new (same rebuild): the correction is LATERAL ONLY. The 3.5M eval
# showed the free correction made the zombies slower (3.1 -> 2.6 m/s) instead
# of dodging, so they stood longer in the line of fire (coordinator 46/36/32%
# vs RL 34/26/22% at evader 2.0/2.3/2.6). Now forward speed is always full and
# the policy only chooses how far to step left or right. This also blocks the
# obvious answer to a hit penalty ("just don't approach").
#
# Watch Shoot/HitRate first (should drop below 55%), then Shoot/Deaths and
# Pursuit/CaptureRate. Also Environment/Cumulative Reward is no longer 0: it is
# minus 0.05 per hit taken, so it should rise towards 0.

behaviors:
  Zombie:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      beta_schedule: linear
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 500000
    max_steps: 20000000
    time_horizon: 256
    summary_freq: 20000

environment_parameters:
  # success = pinned contact (no HP)
  kill_mode: 0
  pinned_capture: 1
  pinned_max_gap: 180.0
  pinned_radius: 5.0
  # per-agent rewards off: only team rewards remain
  crowd_exempt_radius: 1000.0
  crowd_penalty: 0.0
  visible_reward: 0.0
  evader_limited_sight: 1
  intel_share_radius: 0
  # guidance
  # residual on, carrot-follow reward off
  slot_residual: 0.5
  slot_follow_reward: 0.0
  encircle_reward: 0.5
  cutoff_reward: 0.0
  # mixed pack (same as the coordinator test: normal 3.5 / runner 4.0 / tank 2.5)
  normal_speed: 3.5
  runner_speed: 4.0
  tank_speed: 2.5
  # difficulty: the coordinator alone handles faster evaders, so start at 3.0
  # and let the normal adaptive rule raise it
  # continue where zombie_shoot ended up
  adaptive_start: 2.2
  adaptive_window: 10
  adaptive_step: 0.1
  adaptive_raise: 0.5
  adaptive_lower: 0.3
  # the evader shoots back
  dummy_shoot: 1
  dummy_fire_interval: 1.0
  dummy_damage: 20.0
  dummy_mag: 12
  dummy_reload: 1.8
  dummy_bullet_speed: 40.0
  dummy_range: 20.0
  dummy_spread: 8.0
  dummy_turn_speed: 180.0
  dummy_reaction: 0.6
  dummy_aim_lead: 0.3
  dummy_backpedal: 0.8
  dummy_flee_scale: 0.6
  # zombie virtual HP (normal / runner / tank) and team penalty per death
  zombie_hp_normal: 50.0
  zombie_hp_runner: 35.0
  zombie_hp_tank: 150.0
  zombie_death_penalty: 0.2
  # new: the zombie that is hit pays immediately
  zombie_hit_penalty: 0.05
  # new: correction only sideways (forward speed stays full)
  slot_residual_lateral: 1
