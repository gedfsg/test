# shoot3 continued: +10M steps on top of zombie_shoot3 (use --resume with the same run-id).
# mlagents-learn config/zombie_poca_shoot3_more.yaml --run-id=zombie_shoot3 --resume --env="BuildsShoot/My First Game.exe" --no-graphics --num-envs=2
# shoot3: zombies never die (HP 1e6), hit = -0.03 penalty + 0.3s stun.
# crowd_penalty / slot_follow_reward off (they caused reward hacking in res1/res2).
# Curriculum uses 'progress' (training step ratio) because Zombie reward is mostly negative.
# mlagents-learn config/zombie_poca_shoot3.yaml --run-id=zombie_shoot3 --env="BuildsShoot/My First Game.exe" --no-graphics --num-envs=2
behaviors:
  Zombie:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.008
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 500000
    max_steps: 30000000
    time_horizon: 256
    summary_freq: 20000

environment_parameters:
  kill_mode: 0
  pinned_capture: 1
  pinned_max_gap: 150.0
  pinned_radius: 8.0
  pinned_control_angle: 25.0
  crowd_exempt_radius: 3.5
  crowd_penalty: 0.0
  visible_reward: 0.0
  evader_limited_sight: 1
  intel_share_radius: 0
  slot_residual: 0.8
  slot_follow_reward: 0.0
  encircle_reward: 0.5
  cutoff_reward: 0.25
  normal_speed: 3.5
  runner_speed: 4.2
  tank_speed: 2.5
  adaptive_start: 3.4   # resume: start near where shoot3 ended (3.5), not from 2.2
  adaptive_window: 10
  adaptive_step: 0.1
  adaptive_raise: 0.55
  adaptive_lower: 0.3
  dummy_shoot: 1
  dummy_fire_interval:
    curriculum:
      - name: fire_interval_easy
        completion_criteria:
          measure: progress
          behavior: Zombie
          signal_smoothing: false
          min_lesson_length: 100
          threshold: 0.15
        value: 1.4
      - name: fire_interval_mid
        completion_criteria:
          measure: progress
          behavior: Zombie
          signal_smoothing: false
          min_lesson_length: 100
          threshold: 0.35
        value: 1.15
      - name: fire_interval_hard
        value: 1.0
  dummy_damage:
    curriculum:
      - name: damage_easy
        completion_criteria:
          measure: progress
          behavior: Zombie
          signal_smoothing: false
          min_lesson_length: 100
          threshold: 0.15
        value: 12.0
      - name: damage_mid
        completion_criteria:
          measure: progress
          behavior: Zombie
          signal_smoothing: false
          min_lesson_length: 100
          threshold: 0.35
        value: 16.0
      - name: damage_hard
        value: 20.0
  dummy_mag: 12
  dummy_reload: 1.8
  dummy_bullet_speed: 40.0
  dummy_range: 20.0
  dummy_spread: 8.0
  dummy_turn_speed: 180.0
  dummy_reaction: 0.6
  dummy_aim_lead:
    curriculum:
      - name: aim_lead_easy
        completion_criteria:
          measure: progress
          behavior: Zombie
          signal_smoothing: false
          min_lesson_length: 100
          threshold: 0.15
        value: 0.0
      - name: aim_lead_mid
        completion_criteria:
          measure: progress
          behavior: Zombie
          signal_smoothing: false
          min_lesson_length: 100
          threshold: 0.35
        value: 0.15
      - name: aim_lead_hard
        value: 0.3
  dummy_backpedal: 0.8
  dummy_flee_scale: 0.75
  zombie_hp_normal: 1000000.0
  zombie_hp_runner: 1000000.0
  zombie_hp_tank: 1000000.0
  zombie_death_penalty: 0.0
  zombie_hit_penalty: 0.03
  slot_residual_lateral: 1
  zombie_hit_stun: 0.3
