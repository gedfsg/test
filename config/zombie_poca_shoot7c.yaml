# shoot7c: shoot7b was still improving at 10M (walking speed 3.5 -> 4.4, capture ~50%). Same rules, +10M steps.
# mlagents-learn config/zombie_poca_shoot7c.yaml --run-id=zombie_shoot7c --initialize-from=zombie_shoot7b --env="BuildsShoot/My First Game.exe" --no-graphics --num-envs=2
behaviors:
  Zombie:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.008
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 500000
    max_steps: 10000000
    time_horizon: 256
    summary_freq: 20000

environment_parameters:
  kill_mode: 0
  pinned_capture: 1
  pinned_max_gap: 150.0
  pinned_radius: 8.0
  pinned_control_angle: 25.0
  crowd_exempt_radius: 3.5
  crowd_penalty: 0.0
  visible_reward: 0.0
  evader_limited_sight: 1
  intel_share_radius: 0
  slot_residual: 0.8
  slot_follow_reward: 0.0
  encircle_reward: 0.5
  cutoff_reward: 0.25
  normal_speed: 4.5
  runner_speed: 5.75
  tank_speed: 3.0
  adaptive_start: 4.4
  adaptive_min: 2.0
  adaptive_max: 6.0
  adaptive_window: 10
  adaptive_step: 0.1
  adaptive_raise: 0.55
  adaptive_lower: 0.3
  dummy_shoot: 1
  dummy_fire_interval: 0.1
  dummy_fire_interval_max: 0.5
  dummy_damage: 20.0
  dummy_mag: 30
  dummy_reload: 1.5
  dummy_bullet_speed: 70.0
  dummy_bullet_speed_max: 150.0
  dummy_range: 25.0
  dummy_spread: 15.0
  dummy_turn_speed: 180.0
  dummy_reaction: 0.6
  dummy_aim_lead: 0.3
  dummy_perception_delay: 0.4
  dummy_sprint: 1
  dummy_sprint_mult: 1.8
  dummy_stamina: 100
  dummy_sprint_cost: 25
  dummy_stamina_regen: 15
  dummy_sprint_dist: 6
  dummy_backpedal: 0.8
  dummy_flee_scale: 0.75
  zombie_hp_normal: 1000000.0
  zombie_hp_runner: 1000000.0
  zombie_hp_tank: 1000000.0
  zombie_death_penalty: 0.0
  zombie_hit_penalty: 0.008
  slot_residual_lateral: 1
  zombie_hit_stun: 0.3
  zombie_aim_penalty: 0.0
  zombie_aim_width: 0.6

engine_settings:
  time_scale: 20
  capture_frame_rate: 200
  target_frame_rate: -1
