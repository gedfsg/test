# Step "coordinator + RL" (slot-guided RL).
#
# Comments are ASCII-only on purpose: ml-agents opens this file without an
# encoding, so on a Korean Windows any UTF-8 Hangul here crashes the loader.
#
# Why: pure multi-agent RL never learned to encircle (CutoffScore 0.02, all
# five zombies stayed behind the evader). The five agents are identical, so
# nothing tells them who should go left, right or ahead. A rule-based pack
# coordinator (HunterPackTactics) now makes that decision: it spreads slots
# around the evader's predicted position (first slot = the escape direction,
# no slots towards walls), assigns each zombie the slot it reaches fastest
# (runners ahead, tank pushes from behind), and orders everyone to rush once
# the largest gap (zombies + walls) is <= 120 deg. In a 2D test this alone
# caught a 4.0 m/s evader 59/60 times with 3.5 m/s zombies (chasing: 0/60).
#
# Here the coordinator only ADVISES. Each agent gets its slot through a new
# sensor (ZombieSlotSensor: has order, direction, distance, rush flag, gap)
# and decides its own movement. Rewards:
#   - team: pinned capture (+1), time penalty, terrain-aware encircle shaping
#   - individual: slot_follow_reward per 10 m closer to the own slot
#     (potential-based, jumps > 1 m in the order point are skipped)
# The team reward is unchanged, so leaving the slot is allowed when it
# catches better.
#
# New inputs (terrain 21 + role 5 + slot 6 sensors on top of vector 45), so
# this run starts from scratch (no --initialize-from).
#
# Scene: Tools/Zombie/<slot scene 3x3> -> Assets/Scenes/ZombieTrainingSlot.unity
#   Build: only that scene -> BuildsSlot/
#
#   mlagents-learn config/zombie_poca_slot.yaml --run-id=zombie_slot
#     --env="BuildsSlot/My First Game.exe" --no-graphics --num-envs=2
#
# Watch: Pursuit/CaptureRate, Pursuit/EvaderSpeed (should climb above the
# zombie speed 3.5), Slot/OrderDistance (should drop), Pursuit/EncircleScore,
# Pursuit/CutoffScore, Pursuit/CaptureOpenness (lower = trapped near walls).

behaviors:
  Zombie:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      beta_schedule: linear
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 500000
    max_steps: 20000000
    time_horizon: 256
    summary_freq: 20000

environment_parameters:
  # success = pinned contact (no HP)
  kill_mode: 0
  pinned_capture: 1
  pinned_max_gap: 180.0
  pinned_radius: 5.0
  crowd_exempt_radius: 5.0
  evader_limited_sight: 1
  intel_share_radius: 0
  # guidance
  slot_follow_reward: 0.2
  encircle_reward: 0.5
  cutoff_reward: 0.0
  # mixed pack (same as the coordinator test: normal 3.5 / runner 4.0 / tank 2.5)
  normal_speed: 3.5
  runner_speed: 4.0
  tank_speed: 2.5
  # difficulty: the coordinator alone handles faster evaders, so start at 3.0
  # and let the normal adaptive rule raise it
  adaptive_start: 3.0
  adaptive_window: 10
  adaptive_step: 0.1
  adaptive_raise: 0.5
  adaptive_lower: 0.3
