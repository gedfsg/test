# Baseline: coordinator only, in the SAME arena as zombie_poca_slot_res.yaml.
#
# Comments are ASCII-only on purpose: ml-agents opens this file without an
# encoding, so on a Korean Windows any UTF-8 Hangul here crashes the loader.
#
# Identical to zombie_poca_slot_res.yaml except slot_residual 0.001: the
# policy's correction is multiplied by 0.001, so the zombies move along the
# coordinator's direction only (the trainer still runs, but its output has no
# visible effect). When the pack does not know where the evader is (about 5%
# of the time) the policy moves the zombies as usual, same as in the RL run.
# Same build (BuildsSlot), no rebuild. 1M steps are enough for ~50 episodes.
#
#   mlagents-learn config/zombie_poca_slot_base.yaml --run-id=zombie_slot_base
#     --env="BuildsSlot/My First Game.exe" --no-graphics --num-envs=2
#
# Compare Pursuit/CaptureRate (and EncircleScore, UnpinnedContacts) with
# zombie_slot_res3 at 3M (1M-bucket means: 32% / 43% / 39%).

behaviors:
  Zombie:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      beta_schedule: linear
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 500000
    max_steps: 1000000
    time_horizon: 256
    summary_freq: 20000

environment_parameters:
  # success = pinned contact (no HP)
  kill_mode: 0
  pinned_capture: 1
  pinned_max_gap: 180.0
  pinned_radius: 5.0
  # per-agent rewards off: only team rewards remain
  crowd_exempt_radius: 1000.0
  crowd_penalty: 0.0
  visible_reward: 0.0
  evader_limited_sight: 1
  intel_share_radius: 0
  # guidance
  # residual on, carrot-follow reward off
  slot_residual: 0.001
  slot_follow_reward: 0.0
  encircle_reward: 0.5
  cutoff_reward: 0.0
  # mixed pack (same as the coordinator test: normal 3.5 / runner 4.0 / tank 2.5)
  normal_speed: 3.5
  runner_speed: 4.0
  tank_speed: 2.5
  # difficulty: the coordinator alone handles faster evaders, so start at 3.0
  # and let the normal adaptive rule raise it
  adaptive_start: 3.0
  adaptive_window: 10
  adaptive_step: 0.1
  adaptive_raise: 0.5
  adaptive_lower: 0.3
