# Step "coordinator + residual RL".
#
# Comments are ASCII-only on purpose: ml-agents opens this file without an
# encoding, so on a Korean Windows any UTF-8 Hangul here crashes the loader.
#
# Result of the first slot run (zombie_slot, from scratch, 2M steps):
#   capture ~0%, zombie speed 1.5 m/s (still near-random), and the per-agent
#   "follow your slot" reward did not work: the coordinator's order point is
#   a moving carrot a few metres ahead (so zombies circle around the player
#   instead of cutting through), so getting closer to it never reduced the
#   distance much.
#
# Fix: residual policy learning. Each zombie moves along the coordinator's
# direction by default and the policy only adds a correction:
#   final direction = coordinator direction + action * slot_residual
#   speed = its length (max 1) -> pushing against the base slows / stops.
# With action 0 the pack behaves exactly like the coordinator, so captures
# happen from the first episode and the team reward (pinned capture) has a
# signal to improve on. The slot-follow reward is turned off.
#
# Needs a rebuild (ZombieMLBrain / arena code changed). Same scene:
#   Build: only Assets/Scenes/ZombieTrainingSlot.unity -> BuildsSlot/
#
#   mlagents-learn config/zombie_poca_slot_res.yaml --run-id=zombie_slot_res
#     --env="BuildsSlot/My First Game.exe" --no-graphics --num-envs=2
#
# In the game the _RL_Slot prefab must use the same residual (0.5, set by the
# prefab tool).
#
# Result of the first residual run (zombie_slot_res), 1M steps:
#   capture 62% at the start (= coordinator level) -> 27-41%, while the
#   per-agent reward went from -4.8 to -2.3. That per-agent reward is almost
#   all the crowd penalty (-0.004 per mate within 4 m per step): the
#   coordinator closes the ring and rushes in together, so the penalty fires
#   all the time and the policy learned to push the zombies apart -> worse
#   captures. The coordinator already spaces the pack, so the crowd penalty
#   is switched off here (exempt radius larger than the arena; yaml only, no
#   rebuild). Start a NEW run (the old one learned the wrong correction):
#
#   mlagents-learn config/zombie_poca_slot_res.yaml --run-id=zombie_slot_res2
#     --env="BuildsSlot/My First Game.exe" --no-graphics --num-envs=2

#
# Result of the second residual run (zombie_slot_res2), 1M steps:
#   capture 58% -> 15-30%, episodes got longer (730 -> 1070 decisions) and the
#   per-agent reward ROSE from +4.3 to +6.5. With the crowd penalty gone, the
#   only per-agent reward left was visible_reward (+0.002 per step while the
#   zombie sees the evader). It grows with episode length, so the policy
#   learned to keep the evader in sight instead of trapping it (reward
#   hacking). Both per-agent rewards are now switched off from yaml
#   (visible_reward, crowd_penalty; needs the rebuilt ZombieAgent). Only the
#   team rewards remain: pinned capture, time penalty, encircle shaping.
#
#   Rebuild (ZombieAgent changed), then a NEW run:
#   mlagents-learn config/zombie_poca_slot_res.yaml --run-id=zombie_slot_res3
#     --env="BuildsSlot/My First Game.exe" --no-graphics --num-envs=2

behaviors:
  Zombie:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      beta_schedule: linear
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 500000
    max_steps: 20000000
    time_horizon: 256
    summary_freq: 20000

environment_parameters:
  # success = pinned contact (no HP)
  kill_mode: 0
  pinned_capture: 1
  pinned_max_gap: 180.0
  pinned_radius: 5.0
  # per-agent rewards off: only team rewards remain
  crowd_exempt_radius: 1000.0
  crowd_penalty: 0.0
  visible_reward: 0.0
  evader_limited_sight: 1
  intel_share_radius: 0
  # guidance
  # residual on, carrot-follow reward off
  slot_residual: 0.5
  slot_follow_reward: 0.0
  encircle_reward: 0.5
  cutoff_reward: 0.0
  # mixed pack (same as the coordinator test: normal 3.5 / runner 4.0 / tank 2.5)
  normal_speed: 3.5
  runner_speed: 4.0
  tank_speed: 2.5
  # difficulty: the coordinator alone handles faster evaders, so start at 3.0
  # and let the normal adaptive rule raise it
  adaptive_start: 3.0
  adaptive_window: 10
  adaptive_step: 0.1
  adaptive_raise: 0.5
  adaptive_lower: 0.3
