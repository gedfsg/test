# Zombie MA-POCA, 5 zombies per arena, observation v3 (nearest 4 teammates).
#
# Comments are ASCII-only on purpose: ml-agents opens this file without an
# encoding, so on a Korean Windows any UTF-8 Hangul here crashes the loader.
#
# Why: with 3 zombies an encirclement only exists when all three are almost exactly
# 120 deg apart, so random exploration practically never produced one and there was
# nothing to reinforce. With 5 zombies a loose spread already leaves someone on the
# far side of the evader.
#
# Observation size changed 31 -> 45, so this run MUST start from scratch
# (no --initialize-from).
#
# Steps grow 5/3 times faster per simulated second than with 3 zombies
# (every zombie decision is one step), hence the larger max_steps.
#
#   mlagents-learn config/zombie_poca_squad.yaml --run-id=zombie_poca_squad
#     --env="BuildsOpen/My First Game.exe" --no-graphics --num-envs=2

behaviors:
  Zombie:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 1.5e-4
      learning_rate_schedule: linear
      beta: 1.5e-2
      beta_schedule: constant
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 500000
    max_steps: 30000000
    time_horizon: 256
    summary_freq: 20000

environment_parameters:
  encircle_reward: 0.5
  adaptive_start: 3.1
