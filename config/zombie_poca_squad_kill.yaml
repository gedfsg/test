# Step A+B: start from the squad model (which learned to encircle with 5 equal
# zombies at 3.5 m/s, contact capture) and teach it to actually kill.
#
# Comments are ASCII-only on purpose: ml-agents opens this file without an
# encoding, so on a Korean Windows any UTF-8 Hangul here crashes the loader.
#
# Same scene and inputs as zombie_poca_squad (open circular arena, vector 45,
# no terrain/role sensors), so the network can be initialized from it:
#
#   File/Build Profiles: only Assets/Scenes/ZombieTrainingOpen.unity
#     -> build to BuildsOpenKill/   (keep the old BuildsOpen as it is)
#
#   mlagents-learn config/zombie_poca_squad_kill.yaml --run-id=zombie_squad_kill
#     --initialize-from=zombie_poca_squad
#     --env="BuildsOpenKill/My First Game.exe" --no-graphics --num-envs=2
#
# What changes compared to the squad run (all through environment_parameters,
# no scene rebuild needed):
#   A. kill_mode: touching is not enough; 50 virtual HP, real attacks only
#      (range 1.8 m, cooldown 1.5 s, 10 damage). Crowd penalty waived within 5 m
#      of the target so several zombies may hit together.
#   B. evader_limited_sight: the dummy only knows zombies it can see (not behind
#      walls, up to 30 m) or hear (within 5 m) and remembers them for 2 s, like a
#      human player. Flanking around obstacles can now surprise it.
#   intel_share_radius stays 0 (whole arena shares, same as the squad run).
#   If the pack still only chases from behind, try 15 here (resume is fine).
#
# Lessons from the terrain run, applied here from the start:
#   - beta 5e-3 with linear decay (1.5e-2 constant let the action noise explode)
#   - adaptive rule: raise at >= 50% success, judge every 6 episodes

behaviors:
  Zombie:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      # Fine-tuning from a converged model: keep it moderate.
      learning_rate: 1.5e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      beta_schedule: linear
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 500000
    max_steps: 30000000
    time_horizon: 256
    summary_freq: 20000

environment_parameters:
  # A
  kill_mode: 1
  dummy_health: 50.0
  crowd_exempt_radius: 5.0
  # B
  evader_limited_sight: 1
  # unchanged from the squad run
  encircle_reward: 0.5
  intel_share_radius: 0
  # difficulty: the squad model reached 3.65 m/s with contact capture; killing is
  # harder, so start a bit lower
  adaptive_start: 3.0
  adaptive_window: 6
  adaptive_step: 0.1
  adaptive_raise: 0.5
  adaptive_lower: 0.3
