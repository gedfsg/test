# Step "pinned capture": the goal is trapping, not killing.
#
# Comments are ASCII-only on purpose: ml-agents opens this file without an
# encoding, so on a Korean Windows any UTF-8 Hangul here crashes the loader.
#
# Why: with kill mode (5 hits needed) the kill rate sat at 30-45%, the adaptive
# evader speed stayed at ~2.6 m/s (slower than the zombies), chasing from behind
# kept working, and the escape gap at the kill moment grew to ~230 deg. In the
# game the zombies attack automatically anyway; the policy only has to position
# them. So success is now "touch the evader while it is trapped":
#   - contact (centre distance <= capture radius 1.2 m) AND
#   - the largest open direction around the evader <= pinned_max_gap degrees,
#     where zombie bodies within pinned_radius and walls within 3 m count as
#     blocked. A lone zombie touching from behind does not count; the episode
#     simply goes on.
# No HP, so the adaptive evader speed can climb again; the evader keeps its
# limited sight (B), so flanking around obstacles can surprise it.
#
# Same scene and inputs as the squad / squad_kill runs (open arena, vector 45):
#   Build: only Assets/Scenes/ZombieTrainingOpen.unity -> BuildsOpenKill/
#
#   mlagents-learn config/zombie_poca_squad_pin.yaml --run-id=zombie_squad_pin
#     --initialize-from=zombie_squad_kill
#     --env="BuildsOpenKill/My First Game.exe" --no-graphics --num-envs=2
#
# New stats: Pursuit/UnpinnedContacts (contacts that did not count, per episode)
# and Pursuit/CaptureGapWithWalls (gap at the successful touch).

behaviors:
  Zombie:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 1.5e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      beta_schedule: linear
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 500000
    max_steps: 30000000
    time_horizon: 256
    summary_freq: 20000

environment_parameters:
  # success = pinned contact (no HP)
  kill_mode: 0
  pinned_capture: 1
  pinned_max_gap: 180.0
  pinned_radius: 5.0
  # several zombies close to the evader is exactly what pinning needs
  crowd_exempt_radius: 5.0
  # B: the evader only knows zombies it can see or hear
  evader_limited_sight: 1
  encircle_reward: 0.5
  intel_share_radius: 0
  # the kill run sat at 2.6 m/s; start there and let it climb
  adaptive_start: 2.6
  adaptive_window: 6
  adaptive_step: 0.1
  adaptive_raise: 0.5
  adaptive_lower: 0.3
