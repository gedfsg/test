# Step "pinned capture, fast evader": same as zombie_poca_squad_pin, but the
# evader is never allowed to slow down.
#
# Comments are ASCII-only on purpose: ml-agents opens this file without an
# encoding, so on a Korean Windows any UTF-8 Hangul here crashes the loader.
#
# Why: in zombie_squad_pin the success rate sat at 30-36%, inside the adaptive
# dead band, and the evader drifted from 2.6 down to 2.3 m/s while the zombies
# move at ~3.26 m/s. Against an evader that much slower, simply following it
# keeps producing contacts (35-50 unpinned contacts per episode), so there was
# little reason to go around and block. Learning flattened after ~6M steps.
#
# Here:
#   - adaptive_start 3.0: close to the zombie speed, chasing from behind barely
#     closes the distance any more; cutting off / closing the ring is needed.
#   - adaptive_lower 0: the speed is lowered only if the success rate is below
#     0%, i.e. never. It can still rise at >= 50% success.
# Everything else (pinned rule, limited sight, rewards) is unchanged.
#
# No rebuild: same scene and build as squad_pin (BuildsOpenKill).
#
#   (first try, superseded - see below)
#   mlagents-learn config/zombie_poca_squad_pin_fast.yaml --run-id=zombie_squad_pin_fast
#     --initialize-from=zombie_squad_pin
#     --env="BuildsOpenKill/My First Game.exe" --no-graphics --num-envs=2
#
# Result of the first try (adaptive_start 3.0, adaptive_lower 0), 5M steps:
#   success 20% -> 7-12%, encircle score 0.19 -> 0.07, unpinned contacts
#   40 -> 10. Too hard: the pack could no longer reach the evader at all and
#   the policy got worse. Also a ratchet: with window 6, a lucky 3/6 raised
#   the speed (3.0 -> 3.05) and it could never come back down.
#
# Second try (this file): a FIXED evader speed of 2.8 m/s.
#   adaptive_step 0 -> the speed never changes, up or down, so no ratchet and
#   no dead-band drift. 2.8 sits between 2.6 (40% success, chasing works) and
#   3.0 (too hard). Start again from zombie_squad_pin, not from the failed run:
#
#   mlagents-learn config/zombie_poca_squad_pin_fast.yaml --run-id=zombie_squad_pin_28
#     --initialize-from=zombie_squad_pin
#     --env="BuildsOpenKill/My First Game.exe" --no-graphics --num-envs=2
#
# To make it harder later: stop, change adaptive_start (e.g. 2.9) and --resume;
# the start speed is re-read on every launch.
#
# Result of the second try at ~10M: success flat at 8-13%, encircle score
# flat at ~0.08, and CutoffScore (zombies ahead of the evader) only 0.02:
# the whole pack stays behind. The final success signal is too rare to teach
# getting ahead. Third step (resume the same run, no rebuild):
#   encircle_reward 0.5 -> 1.0  and  cutoff_reward 0 -> 0.5
# Both are potential-based (per-step change of the score; the episode sum
# telescopes), so they guide towards ring / blocking the way ahead without
# creating a stalling exploit.
#
#   mlagents-learn config/zombie_poca_squad_pin_fast.yaml --run-id=zombie_squad_pin_28
#     --resume --env="BuildsOpenKill/My First Game.exe" --no-graphics --num-envs=2

behaviors:
  Zombie:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 1.5e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      beta_schedule: linear
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 500000
    # the previous run flattened after ~6M; 20M is plenty to see a trend
    max_steps: 20000000
    time_horizon: 256
    summary_freq: 20000

environment_parameters:
  # success = pinned contact (no HP), unchanged
  kill_mode: 0
  pinned_capture: 1
  pinned_max_gap: 180.0
  pinned_radius: 5.0
  crowd_exempt_radius: 5.0
  evader_limited_sight: 1
  # third step: stronger guidance (was 0.5 / not set)
  encircle_reward: 1.0
  cutoff_reward: 0.5
  intel_share_radius: 0
  # the only change: fixed evader speed (step 0 = never adjusted)
  adaptive_start: 2.8
  adaptive_window: 6
  adaptive_step: 0.0
  adaptive_raise: 0.5
  adaptive_lower: 0.0
