# Zombie MA-POCA, 5 zombies per arena, mixed pack, terrain-aware.
# Inputs: vector v3 (45) + terrain sensor (21) + role sensor (5).
#
# Comments are ASCII-only on purpose: ml-agents opens this file without an
# encoding, so on a Korean Windows any UTF-8 Hangul here crashes the loader.
#
# What is new compared to zombie_poca_squad:
#   - Mixed pack: every episode each arena draws 0-1 tank (2.5 m/s), 0-2 runners
#     (4.5 m/s), rest normal (3.5 m/s). One shared policy for all of them.
#   - ZombieRoleSensor: own top speed + the 4 nearest teammates' top speeds, so a
#     zombie knows whether it should cut ahead (fast) or hold an exit (slow).
#     Roles are NOT scripted; the reward is still the shared team reward.
#   - Kill mode: touching the evader no longer ends the episode. The evader has
#     100 virtual HP and only real zombie attacks (range 1.8 m, cooldown 1.5 s)
#     damage it: normal 10, runner 15, tank 40. Team reward: +0.5 spread over the
#     damage dealt, +1 on the kill. Pursuit/CaptureRate now means kill rate.
#     New stats: Kill/DamageDealt (0-1), Kill/Hits, Role/DamageShare_*.
#     dummy_health follows a curriculum (40 -> 70 -> 100), see the bottom.
#   - Crowd penalty is waived within 5 m of the target (kill needs several
#     zombies in attack range at once, which the 4 m crowd penalty used to punish).
#   - Adaptive evader speed may now go up to 6.0 (player walks at 5).
#   - New stats under Role/: MeanDist_*, Ahead_* (+1 in front of the evader,
#     -1 behind it), CaptureBy_* (1 = that role made the catch).
#   - ZombieTerrainSensor: NavMesh rays, 8 around the zombie itself and 12 around
#     the believed target position (where can the player still run?).
#   - Arena has 4 U-shaped buildings (dead-end alleys), always placed.
#   - Encircle score counts walls as blocked directions, so pinning the evader
#     against a wall or into an alley is rewarded like a teammate standing there.
#   - New stat Pursuit/CaptureOpenness: how open the area around the evader was at
#     the moment of capture (lower = trapped against terrain).
#
# The network has two more inputs than before, so this run MUST start from scratch
# (no --initialize-from the squad model).
#
# Build the training scene first:
#   Tools/Zombie/terrain scene (3x3) -> Assets/Scenes/ZombieTrainingTerrain.unity
#   File/Build Profiles: only that scene -> build to BuildObstacle/
#
#   mlagents-learn config/zombie_poca_terrain.yaml --run-id=zombie_poca_terrain_v2
#     --env="BuildObstacle/My First Game.exe" --no-graphics --num-envs=2

behaviors:
  Zombie:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      # Phase 1: 3.0e-4 over 30M. Phase 2: 2.0e-4 over 50M (decayed to ~0 at 50M).
      # Phase 3 extends to 80M; 2.5e-4 gives ~0.94e-4 at the 50M resume point.
      # Do not go higher: a big learning-rate jump on resume broke a policy before.
      learning_rate: 2.5e-4
      learning_rate_schedule: linear
      # Entropy bonus. Was 1.5e-2 constant (3x the ml-agents default) up to 60M:
      # Policy/Entropy climbed 2.5 -> 6.2 and never leveled off (the squad run
      # leveled at ~3.8), i.e. the movement noise kept growing until the zombies
      # could not stay in attack range. Default value with linear decay instead
      # (at 60M of 80M this is ~1.25e-3).
      beta: 5.0e-3
      beta_schedule: linear
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 500000
    max_steps: 80000000
    time_horizon: 256
    summary_freq: 20000

environment_parameters:
  encircle_reward: 0.5
  # --- v2 phase 2 (resumed at 19M) ---
  # Phase 1 (0-19M) learned to kill, but only by chasing from behind with the
  # runners: kill rate sat at 40-50%, inside the 30-60% dead band of the adaptive
  # rule, so the evader stayed at ~2.4 m/s (slower than every zombie but the tank)
  # and there was never a reason to cut ahead or encircle.
  # Phase 2 lets the evader get faster:
  #   - evader HP 50 (still 5 normal hits / 2 tank hits, so it is not "touch = win")
  #   - raise the speed already at 50% kills, judge every 6 episodes
  #   - resume from the current speed instead of the 2.0 start
  # --- v2 phase 3 (resumed at 50M) ---
  # Phase 2 did not help: 19M-50M the evader only went 2.4 -> 2.85, kill rate 34%,
  # hits per episode 2.4, encircle 0.27, escape gap ~205 deg, everyone still
  # chasing from behind (Role/Ahead_* all about -0.5). The evader turns much
  # faster than the zombies, so a chaser from behind cannot stay in attack range
  # long enough; the answer is to get in front, which the policy never found.
  # Phase 3:
  #   - cutoff_reward: potential-based team reward for zombies standing in front
  #     of where the evader is running (stat: Pursuit/CutoffScore)
  #   - runner_speed 4.5 -> 4.0 so the runners cannot solve everything alone
  #   - resume the evader at its phase-2 speed
  cutoff_reward: 0.5
  normal_speed: 3.5
  runner_speed: 4.0
  tank_speed: 2.5
  adaptive_start: 2.8
  adaptive_window: 6
  adaptive_step: 0.1
  adaptive_raise: 0.5
  adaptive_lower: 0.3
  # Kept as a 3-lesson curriculum on purpose: --resume restores the saved lesson
  # number (2) for dummy_health, so the list must still have a third entry.
  # Phase 1 used 40 HP (0-3M), 70 HP (3-7.5M), 100 HP after that; the third
  # lesson is now 50 HP.
  dummy_health:
    curriculum:
      - name: Weak
        completion_criteria:
          measure: progress
          behavior: Zombie
          threshold: 0.1
        value: 40.0
      - name: Medium
        completion_criteria:
          measure: progress
          behavior: Zombie
          threshold: 0.25
        value: 70.0
      - name: Phase2
        value: 50.0
